      or local, starts at its type''s default, not null:

      integer/long/decimal 0, number 0.0, boolean false, string "", date the epoch,
      lists and maps empty; only variant, byte and cbyte start null.

      Unlike Java and C#, such a variable needs no null guard before its first use.
      This covers declared variables only:

      record fields (input, output, Rollup accumulator) follow their metadata, so
      a nullable field without a default value is null until assigned.

      Metadata fields are nullable unless marked nullable="false".

      '
