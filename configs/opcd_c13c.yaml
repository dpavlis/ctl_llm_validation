# On-policy context distillation, run c13c: c13b continued with the rulev6 teacher (findings §3.25).
# c13b fixed T40 but T42 (a date carried from the previous record) still triggers the belief trap 16/20; the rulev3 teacher fails
# it too (10/20 on rb1009), by adding a null initializer + guard "to be safe". rulev6 = rulev3 + "a value carried from the previous
# record starts at its default; comparing against it on the first record is not a defect unless the spec's first-record rule needs
# otherwise". Teacher checks on rb1009, thinking on: T42 trap 0/20 (mean 1.00), T40 0/20; full v4 n3 fix 0.870 -> 0.967,
# generate 0.989 / 0.984, validate 0.793 / 0.794, WRONG 15.4% / 16.7%. Hard set 2 does not separate the teachers (both 0/60).
# Same mix as c13b; rulev6 replaces rulev3 as the main teacher (thinking-on belief / hard prompts); thinking-off validate stays
# replay-anchored to the plain model; the component-guide teachers are unchanged. 16 rounds.
run: c13c
init_adapter: data/opcd/c13b/round_015/adapter   # c13b final round
base_model: /home/pavlisd/exports/qwen38_rb1009_sftdpo
student: {"on": configs/eval_rb1006_on.yaml, "off": configs/eval_rb1006_off.yaml}   # system prompt + tokenizer only (identical tokenizer)
teacher: {"on": configs/eval_rb1006_rulev6_on.yaml, "off": configs/eval_rb1006_rulev6_off.yaml}   # rulev6 = rulev3 + carried-over values
rule_marker: "Declaration defaults in CTL2"
modes: {generate: "on", fix: "on", validate: "on"}
set_modes: {replay: {validate: "off"}}
set_teacher: {replay: plain}
teachers:   # one per component; the gap prompts name theirs (generate_gaps_c9.jsonl "teacher")
  guide_REFORMAT: {"on": configs/opcd_c9_teachers/guide_REFORMAT_on.yaml, "off": configs/opcd_c9_teachers/guide_REFORMAT_off.yaml, marker: "# Reference: the component you are writing for"}
  guide_PARTITION: {"on": configs/opcd_c9_teachers/guide_PARTITION_on.yaml, "off": configs/opcd_c9_teachers/guide_PARTITION_off.yaml, marker: "# Reference: the component you are writing for"}
  guide_DENORMALIZER: {"on": configs/opcd_c9_teachers/guide_DENORMALIZER_on.yaml, "off": configs/opcd_c9_teachers/guide_DENORMALIZER_off.yaml, marker: "# Reference: the component you are writing for"}
  guide_NORMALIZER: {"on": configs/opcd_c9_teachers/guide_NORMALIZER_on.yaml, "off": configs/opcd_c9_teachers/guide_NORMALIZER_off.yaml, marker: "# Reference: the component you are writing for"}
  guide_ROLLUP: {"on": configs/opcd_c9_teachers/guide_ROLLUP_on.yaml, "off": configs/opcd_c9_teachers/guide_ROLLUP_off.yaml, marker: "# Reference: the component you are writing for"}
  guide_dict_REFORMAT: {"on": configs/opcd_c9_teachers/guide_dict_REFORMAT_on.yaml, "off": configs/opcd_c9_teachers/guide_dict_REFORMAT_off.yaml, marker: "# Reference: the component you are writing for"}
  guide_dict_PARTITION: {"on": configs/opcd_c9_teachers/guide_dict_PARTITION_on.yaml, "off": configs/opcd_c9_teachers/guide_dict_PARTITION_off.yaml, marker: "# Reference: the component you are writing for"}
  guide_dict_DATA_GENERATOR: {"on": configs/opcd_c9_teachers/guide_dict_DATA_GENERATOR_on.yaml, "off": configs/opcd_c9_teachers/guide_dict_DATA_GENERATOR_off.yaml, marker: "# Reference: the component you are writing for"}

  guide11_DATA_INTERSECTION: {"on": configs/opcd_c11_teachers/guide_DATA_INTERSECTION_on.yaml, "off": configs/opcd_c11_teachers/guide_DATA_INTERSECTION_off.yaml, marker: "# Reference: the component you are writing for"}

prompts:
  target:
    - {run: dpodef1, split: train}       # 206: belief-prone fix / validate prompts (c4)
    - {run: dpodef3b_plain}               # 53: declaration-contrast prompts (c4)
  hard:
    - {file: data/opcd/hard_cases.jsonl, weight: 1}    # set 1 (c4)
    - {file: data/opcd/hard_cases2.jsonl, weight: 3}   # set 2: previous-record dates (as c13b)
    - {file: data/opcd/c13b_keep.jsonl, weight: 1, modes: ["on", "off"]}   # every 3rd gap and DI prompt (23 + 17), keeps c13's generate gains
  hard_holdout: data/opcd/hard_holdout_c13.json       # c3 + c9 + c12 holdouts, never trained
  contrast: data/opcd/contrast_prompts.jsonl          # 60 corpus prompts where something really IS null (c4)
  probe: {run: dpodef1, split: probe}
  replay_share: 0.4
  replay_task_mix: {generate: 0.4, validate: 0.35, fix: 0.25}

lora: {r: 32, alpha: 32, dropout: 0.0, target: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}

train:
  seed: 0
  rounds: 16
  prompts_per_round: 32
  k: 2
  steps_per_round: 2
  lr: 2.0e-5
  warmup_steps: 5
  grad_clip: 1.0
  adv_clip: null
  quote_guard: true
  skip_truncated: ["on"]     # c9 trained thinking-on SCD answers only as truncated thinking (Normalizer 64/64 at the cap);
                              # it learned to think longer without concluding (G4 thinking-on -0.19, findings §3.21)
  max_new_tokens: 6144
  cutoff: 8192                # student prompt + completion; the teacher's guide prompt adds ~4.5k tokens to its scoring pass only
  logits_chunk: 1024

probe: {n: 20, k: 2, every: 4}

sampler: {url: "http://127.0.0.1:3011", served_model: rb1009, concurrency: 32}
