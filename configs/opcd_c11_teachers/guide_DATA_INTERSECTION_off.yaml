      \ ports, ctl, examples, mistakes]\n---\n\n# DataIntersection\n\n## Description\n\
      \nSet-difference and intersection operator for two sorted streams: routes records\
      \ that exist only in set A to port 0, records present in both sets to port 1\
      \ (with optional CTL2 transform), and records only in set B to port 2. Both\
      \ inputs must be sorted by the join key. The SQL equivalent is a combination\
      \ of LEFT OUTER JOIN (port 0), INNER JOIN (port 1), and RIGHT OUTER JOIN (port\
      \ 2).\n\n> **Name vs type:** the component is labelled *DataIntersection*; always\
      \ emit `type=\"DATA_INTERSECTION\"`.\n\n## Purpose & when to use\n\nReach for\
      \ DATA_INTERSECTION when:\n- You need to detect records added, removed, or changed\
      \ between two versions of a dataset (change-data-capture / delta detection).\n\
      - You need to separate records that are \"new\" (only in A), \"deleted\" (only\
      \ in B), and \"existing\" (in both).\n- You're driving an SCD Type 2 dimension\
      \ load (port 0 = new dim members, port 1 = potential changes, port 2 = orphaned\
      \ target rows).\n\nDon't use DATA_INTERSECTION when:\n- Inputs are not sorted\
      \ — you must sort both sides by the join key first.\n- You only need matched\
      \ records → use EXT_MERGE_JOIN with `joinType=\"inner\"` or EXT_HASH_JOIN (no\
      \ sort requirement).\n\n## CTL2 contract\n\nSingle entry-point function — the\
      \ shared Joiners transform contract. **Optional for DATA_INTERSECTION** and\
      \ applied **only to the intersection (port 1) records**; the only-in-A (port\
      \ 0) and only-in-B (port 2) records pass through their input schemas unchanged.\n\
      \n```ctl\nfunction integer transform()\n```\n\n**Call order / lifecycle:**\n\
      - `transform()` runs once per matched (intersection) row — i.e. once for each\
      \ key present in both set A and set B.\n- Return `ALL` to emit on port 1, or\
      \ `SKIP` to drop the intersection row.\n\n**Port model:**\n- `$in.0` — set A\
      \ record (\"new\" / current).\n- `$in.1` — set B record (\"old\" / previous)\
      \ — the matched counterpart.\n- `$out.0` — the intersection output record (routed\
      \ to port 1).\n\n> Within the transform, the matched counterpart is `$in.1`\
      \ regardless of the component's three-output-port topology. The transform shapes\
      \ only port 1; ports 0 and 2 are unaffected by it.\n\n**Idioms / keep in mind:**\n\
      - Both `$in.0` and `$in.1` are present in the transform (it fires only on matches),\
      \ so no missing-side null guards are needed — but field-level null guards still\
      \ apply to nullable *values*.\n- Equality operators `==` and `!=` are null-safe\
      \ — use them to compute a `changed` flag across the two versions (e.g. `$in.0.value\
      \ != $in.1.value`); ordered comparisons on nullable values need guards.\n- Use\
      \ fields from the correct side — set-A fields from `$in.0`, set-B fields from\
      \ `$in.1`.\n\n**Minimal skeleton:**\n```ctl\n//#CTL2\nfunction integer transform()\
      \ {\n    $out.0.id        = $in.0.id;\n    $out.0.old_value = $in.1.value; \
      \                 // $in.1 = set B (\"old\")\n    $out.0.new_value = $in.0.value;\
      \                  // $in.0 = set A (\"new\")\n    $out.0.changed   = ($in.0.value\
      \ != $in.1.value);\n    return ALL;\n}\n```\n\n## Examples\n\n### Minimal —\
      \ delta detect (pass-through intersection)\n\n```xml\n<!-- Both inputs must\
      \ be sorted by the join key upstream -->\n<Node id=\"INTERSECT0\" type=\"DATA_INTERSECTION\"\
      \n      joinKey=\"$id=$id\"\n      guiName=\"Delta detect\" guiX=\"500\" guiY=\"\
      200\"/>\n```\n\nPort 0 → new records. Port 1 → changed/existing records. Port\
      \ 2 → deleted records.\n\n### Full — change-data-capture\n\nCompare a \"current\"\
      \ extract (set A) against a \"previous\" extract (set B), both sorted by `customer_id`.\
      \ Route new customers to an INSERT writer, deleted customers to a soft-delete\
      \ writer, and route existing customers through a transform that detects changes.\n\
      \n```xml\n<Node id=\"SORT_CURRENT\"  type=\"EXT_SORT\" sortKey=\"customer_id(a)\"\
      \ guiX=\"100\" guiY=\"50\"/>\n<Node id=\"SORT_PREVIOUS\" type=\"EXT_SORT\" sortKey=\"\
      customer_id(a)\" guiX=\"100\" guiY=\"250\"/>\n\n<Node id=\"INTERSECT0\" type=\"\
      DATA_INTERSECTION\"\n      joinKey=\"$customer_id=$customer_id\"\n      equalNULL=\"\
      false\"\n      guiName=\"CDC detect\" guiX=\"450\" guiY=\"150\">\n  <attr name=\"\
      transform\"><![CDATA[//#CTL2\nfunction integer transform() {\n    $out.0.customer_id\
      \ = $in.0.customer_id;\n    $out.0.name        = $in.0.name;\n    $out.0.changed\
      \     = ($in.0.name != $in.1.name || $in.0.email != $in.1.email);\n    return\
      \ ALL;\n}\n]]></attr>\n</Node>\n\n<!-- Port 0 = new customers → INSERT -->\n\
      <!-- Port 1 = existing customers (check changed flag) -->\n<!-- Port 2 = deleted\
      \ customers → soft-delete -->\n```\n\n## Common mistakes\n\n- **Unsorted inputs\
      \ produce silently wrong output.** DATA_INTERSECTION uses a streaming merge\
      \ algorithm that advances whichever input has the smaller key. If inputs aren't\
      \ sorted by `joinKey`, records are routed to the wrong port without any error.\
      \ Always place EXT_SORT immediately upstream on both ports.\n- **`(a)`/`(d)`\
      \ or `#` in `joinKey`.** DATA_INTERSECTION parses its key with the hash-join\
      \ parser: map the two sides with `=` (`$id=$id`). An `(a)` suffix is read as\
      \ part of the field name and a `#` starts a non-existent second slave port —\
      \ both fail CheckConfig. The required sort goes on the upstream EXT_SORT, not\
      \ in `joinKey`.\n- **Not connecting all three output ports.** Records routed\
      \ to an unconnected port are silently dropped. If you only need port 1 (intersection),\
      \ still connect ports 0 and 2 to TRASH to avoid silent data loss.\n- **Missing\
      \ `<Metadata>` on port 1 when using a transform.** The transform changes the\
      \ schema of intersection records. If no output metadata is defined for port\
      \ 1's edge, CheckConfig fails with an unknown-field error.\n- **Using DATA_INTERSECTION\
      \ as a plain inner join.** If both inputs have duplicate keys and you just want\
      \ matched pairs, EXT_HASH_JOIN is more appropriate — DATA_INTERSECTION is optimized\
      \ for set-difference semantics.\n\n### 8.9 DataIntersection\n\nCompares two\
      \ inputs **sorted** on the Join key (`$a_key=$b_key;…`): input 0 = flow A (e.g.\
      \ the previous snapshot), input 1 = flow B (e.g. the new data).\n\n| Output\
      \ port | Records | Produced by |\n|---|---|---|\n| 0 | key only in A | the component,\
      \ unchanged (input-0 metadata) |\n| 1 | key in both A and B | the CTL `transform()`\
      \ (its own metadata) |\n| 2 | key only in B | the component, unchanged (input-1\
      \ metadata) |\n\n- `transform()` uses the joiner template and sees **matched\
      \ pairs only**: `$in.0` is the A record, `$in.1` the B record. A-only and B-only\
      \ records never reach CTL, so INSERT / DELETE need no code.\n- **The transform\
      \ writes `$out.0`**, and the component sends that record out on **port 1** (the\
      \ port reserved for matches). CTL has only this one output record: writing `$out.1`\
      \ or `$out.2` fails when the component initialises. Ports 0 and 2 are pass-through\
      \ and are never written from CTL. Only `transform()` (and `transformOnError`)\
      \ is called; functions such as `transformLeftOnly()` are never invoked.\n- **The\
      \ return value never selects a port** (unlike §8.1): `OK`, `0`, `1` or `ALL`\
      \ emit the record on port 1; `SKIP` drops it; `STOP` makes the component fail.\
      \ Ports 0 and 2 are unaffected by it.\n- Defaults: *Equal NULL* = true (null\
      \ key values match each other); *Allow key duplicates* = true (duplicate keys\
      \ give the Cartesian product of pairs, A-major).\n\n```ctl\n//#CTL2\nfunction\
      \ integer transform() {\n    if ($in.0.status == $in.1.status && $in.0.amount\
      \ == $in.1.amount) {\n        return SKIP;              // unchanged pair: drop\
      \ it\n    }\n    $out.0.* = $in.1.*;          // goes out on port 1\n    $out.0.cdc_action\
      \ = \"UPDATE\";\n    return ALL;                   // OK, 0 or 1 emit it on\
      \ port 1 as well\n}\n```\n\n---\n\n# Reference: verified runtime behaviour\n\
      \n### 13.3 Runtime behaviour verified on the server (live runs, 2026-10-13)\n\
      \nFacts settled by running graphs on CloverDX Server 7.4 (run ids in `data/suite_v5/validation_report.json`).\
      \ They decide whether code works at runtime, not only whether it compiles.\n\
      \n| Topic | Verified behaviour |\n|---|---|\n| Empty string to number | `str2decimal(\"\
      \")` **throws** (it does not return null). Guard blank text before converting,\
      \ or use the conditional-fail form `str2decimal(s) : null`. `str2decimal` also\
      \ accepts forms a business grammar may forbid (e.g. exponents), so check the\
      \ shape first when the spec restricts it. |\n| Strict dates | `isDate(s, \"\
      yyyy-MM-dd\", \"en.US\", \"UTC\", true)` is false for `2025-02-30` and for `2025-1-1`;\
      \ strict `str2date` with the same arguments **throws** on both. Whether strict\
      \ parsing rejects trailing characters (`2026-01-01x`) is not verified: use an\
      \ explicit whole-string shape check (`s ~= \"[0-9]{4}-[0-9]{2}-[0-9]{2}\"`)\
      \ when the spec requires the exact shape. |\n| Host time zone | Date functions\
      \ without a time-zone argument (`str2date`, `date2str`, `createDate`, `getMonth`,\
      \ `getYear`, …) use the server's default zone, not UTC. For UTC business dates\
      \ pass `\"UTC\"` explicitly, e.g. `getMonth(d, \"UTC\")`, `createDate(2026,\
      \ 1, 1, \"UTC\")`. |\n| Day arithmetic across DST | `dateAdd(d, n, day)` steps\
      \ calendar days in the host time zone, so on a host with DST a UTC-midnight\
      \ value shifts by an hour across the change: `dateAdd(2026-03-30 00:00 UTC,\
      \ -1, day)` = 2026-03-29 **01:00** UTC and `dateAdd(2026-10-26 00:00 UTC, -1,\
      \ day)` = 2026-10-24 **23:00** UTC on a CET host. For UTC calendar days use\
      \ fixed milliseconds, `dateAdd(d, -86400000L, millisec)`, which keeps UTC midnight\
      \ (run 18244). |\n| Rollup emit loop | `updateTransform(counter, …)` and `transform(counter,\
      \ …)` are called repeatedly with `counter` = 0, 1, 2, … until they return `SKIP`.\
      \ To emit one record, return `SKIP` when `counter > 0` (see §8.7). |\n| Denormalizer\
      \ reset | Resetting the group state at the end of `transform()` gives the same\
      \ result as resetting it in `clean()`. |\n| Normalizer | It has exactly one\
      \ output port. `count()` returning 0 emits nothing for that input record; returning\
      \ `SKIP` from `transform(idx)` drops only that child. |\n| DataGenerator | With\
      \ `recordsNumber = 0`, `generate()` is never called. The configured record count\
      \ ends generation; `generate()` returns `OK` / `ALL` on every call. |\n| ExtMergeJoin\
      \ full outer | Matched pairs and one-sided records all go through `transform()`\
      \ and out on output 0; the fields of the absent side read as null. Optional\
      \ output 1 carries unjoined master records unchanged. |\n| ExtMergeJoin absent\
      \ side | In a left-outer ExtMergeJoin, `isnull($in.1)` does **not** detect a\
      \ missing slave record; the absent side's fields read as null, so test a field\
      \ the slave always has (e.g. its non-nullable key: `$in.1.key == null`). A branch\
      \ built on `isnull($in.1)` mis-routes (probe run 5019 failed; the field-level\
      \ test, run 5020, passed — owner's server, SCD-2 set validation). |\n| Joiner\
      \ duplicates disabled | With duplicate keys not allowed (Allow key duplicates\
      \ = false), the joiner keeps the **first** record encountered for each key on\
      \ the duplicated side (run 5021, owner's server). |\n| Lookup duplicates | Iterating\
      \ several records for one key (`get(...)` then `next()`) needs the lookup table's\
      \ `keyDuplicates=true`; `get(...)` returns null on a miss. |\n| Rounding | `round(decimal,\
      \ n)` rounds halves away from zero: `round(2.505D, 2) = 2.51`, `round(-2.505D,\
      \ 2) = -2.51`. |\n| Graph parameters | `RUN_ID` is reserved by the server (it\
      \ is replaced by the numeric execution id); use another name for business run\
      \ ids. |\n| Strings | `length()` counts UTF-16 code units (`length(\"A\U0001F600\
      \") = 3`). `sort()` on a string list is case-sensitive, by UTF-16 code unit\
      \ (upper case before lower case). |\n| DataIntersection | See §8.9: `$out.0`,\
      \ emitted on port 1; `STOP` fails the component. |\n"
