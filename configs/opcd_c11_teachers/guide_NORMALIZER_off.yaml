      ---\n\n# Normalizer\n\n## Description\n\nExpands one input record into multiple\
      \ output records, the count decided per row by a CTL2 `count()` function and\
      \ each output built by `transform(idx)`. The 1:N transform for JSON-array parsing,\
      \ comma-separated string splitting, and any \"fan out per child\" pattern.\n\
      \n## Purpose & when to use\n\nReach for NORMALIZER when:\n- A single input field\
      \ contains a JSON array → emit one output record per array element.\n- A single\
      \ input field is a delimited string → emit one output record per token.\n- The\
      \ number of output records depends on the input record's content (variable per\
      \ row).\n\nDon't use NORMALIZER when:\n- It's 1:1 → use REFORMAT.\n- It's N:1\
      \ → use DENORMALIZER.\n- The fan-out count is fixed and known per record (always\
      \ 10, etc.) → can sometimes be done with REFORMAT + multi-port routing, but\
      \ NORMALIZER is usually clearest.\n\n## CTL2 contract\n\nThree entry-point functions:\n\
      \n```ctl\nfunction integer count()              // how many output rows for\
      \ this input record\nfunction integer transform(integer idx) // build output\
      \ row idx (0-based)\nfunction void    clean()              // reset module state\
      \ after the last transform\n```\n\n**Call order / lifecycle:**\n- `count()`\
      \ — once per input record. Prepares the split/list state and returns how many\
      \ output rows to emit. Return `0` to skip the current input record entirely\
      \ (no children emitted).\n- `transform(idx)` — called for `idx = 0 .. count()-1`,\
      \ once per output row. Consume the prepared state at position `idx`. Returns\
      \ `OK` (emit on port 0) or `SKIP` (discard this element).\n- `clean()` — once\
      \ after the last `transform` for that input record. Reset module-level state\
      \ before the next source row.\n\nOptional: `init()`, `preExecute()`, `postExecute()`,\
      \ plus `*OnError` functions.\n\n**Port model:** one input (`$in.0`) fanning\
      \ out to many rows on `$out.0`. `$in.0` is reliably readable in `count()`; prepare\
      \ per-record state there and consume it in `transform(idx)` rather than re-reading\
      \ `$in.0` for every child.\n\n**Idioms / keep in mind:**\n- **Declare shared\
      \ state at module level** (outside the functions) — e.g. `variant payload =\
      \ {};` or `string[] parts;`. State must persist between `count()` and the per-element\
      \ `transform(idx)` calls.\n- **Parse / split once in `count()`, reuse in `transform(idx)`.**\
      \ Re-parsing inside `transform(idx)` re-parses N times per source record — kills\
      \ performance and breaks `$in.0` access (reliable only in `count()` for some\
      \ inputs).\n- `idx` is zero-based and must stay within the prepared-data bounds\
      \ (`0 .. count()-1`).\n- **JSON:** `parseJson($in.0.content)` returns a `variant`;\
      \ access with **bracket notation** `payload['items'][idx]['name']` (not dot\
      \ notation); convert with `cast(value, type)` where `type` is a keyword (`cast(v,\
      \ string)`). `length()` on a variant array returns its element count.\n- **String\
      \ split:** `split($in.0.tags, \",\")` returns a `string[]`; `length(parts)`\
      \ is the row count; `trim(parts[idx])` per child.\n- `transform(idx)` returns\
      \ `OK` (emit) or `SKIP` (drop this element) — independent of `count()`'s return,\
      \ which only decides how many times `transform` is invoked.\n- **Guard null/blank\
      \ input in `count()`** before split/parse: `if (isBlank($in.0.csv_values)) return\
      \ 0;`. A null/blank string fed to `split()` or `parseJson()` can error or mis-count;\
      \ `return 0` cleanly emits no children for that row.\n\n**Minimal skeleton:**\n\
      ```ctl\n//#CTL2\nstring[] parts;\nfunction integer count() {\n    parts = split($in.0.csv_values,\
      \ \";\");\n    return length(parts);\n}\nfunction integer transform(integer\
      \ idx) {\n    $out.0.id    = $in.0.id;\n    $out.0.value = trim(parts[idx]);\n\
      \    return OK;\n}\nfunction void clean() {\n    clear(parts);\n}\n```\n\n>\
      \ [!NOTE]\n> An `*OnError` function must keep the same parameters as the function\
      \ it guards — e.g. `transformOnError(string errorMessage, string stackTrace,\
      \ integer idx)` must include the `idx` parameter, mirroring `transform(integer\
      \ idx)`. Safe fallback returns: `countOnError` → `0` (emit no children); `transformOnError`\
      \ → `SKIP` (drop that element).\n\n## Examples\n\n### Minimal — string splitting\n\
      \n```xml\n<Node id=\"NORMALIZER0\" type=\"NORMALIZER\" guiX=\"400\" guiY=\"\
      200\">\n  <attr name=\"normalize\"><![CDATA[//#CTL2\nstring[] parts;\nfunction\
      \ integer count() {\n    parts = split($in.0.tags, \",\");\n    return length(parts);\n\
      }\nfunction integer transform(integer idx) {\n    $out.0.id  = $in.0.id;\n \
      \   $out.0.tag = trim(parts[idx]);\n    return OK;\n}\nfunction void clean()\
      \ {\n    clear(parts);\n}\n]]></attr>\n</Node>\n```\n\n### Full — JSON array\
      \ parsing\n\n```xml\n<Node id=\"NORMALIZER1\" type=\"NORMALIZER\" guiX=\"400\"\
      \ guiY=\"350\">\n  <attr name=\"normalize\"><![CDATA[//#CTL2\nvariant payload\
      \ = {};\nfunction integer count() {\n    payload = parseJson($in.0.content);\n\
      \    return length(payload['items']);\n}\nfunction integer transform(integer\
      \ idx) {\n    $out.0.name  = cast(payload['items'][idx]['name'], string);\n\
      \    $out.0.value = cast(payload['items'][idx]['value'], integer);\n    return\
      \ OK;\n}\nfunction void clean() {\n    payload = {};\n}\n]]></attr>\n</Node>\n\
      ```\n\n## Common mistakes\n\n- **Shared state declared inside `count()` instead\
      \ of at module level.** Lost between `count()` and `transform(idx)`. Declare\
      \ `variant payload`/`string[] parts` outside the functions.\n- **Re-parsing\
      \ JSON (or re-splitting) inside `transform(idx)`.** Each child invocation re-parses,\
      \ killing throughput — and `$in.0` may not be reliably readable there. Prepare\
      \ once in `count()`.\n- **Using dot notation for JSON.** `payload.items` fails\
      \ — use `payload['items'][idx]`.\n- **`return OK` vs `return SKIP` confusion.**\
      \ `OK` = emit; `SKIP` = drop this element. The `count()` return is independent\
      \ — it determines how many times `transform(idx)` is invoked.\n- **`count()`\
      \ returning 0.** The whole input record is dropped (no children). Verify your\
      \ JSON path / split delimiter on a sample.\n- **`transformOnError` missing the\
      \ `idx` parameter.** The error handler must mirror `transform(integer idx)`\
      \ and include `idx`.\n\n# Reference: verified runtime behaviour\n\n### 13.3\
      \ Runtime behaviour verified on the server (live runs, 2026-10-13)\n\nFacts\
      \ settled by running graphs on CloverDX Server 7.4 (run ids in `data/suite_v5/validation_report.json`).\
      \ They decide whether code works at runtime, not only whether it compiles.\n\
      \n| Topic | Verified behaviour |\n|---|---|\n| Empty string to number | `str2decimal(\"\
      \")` **throws** (it does not return null). Guard blank text before converting,\
      \ or use the conditional-fail form `str2decimal(s) : null`. `str2decimal` also\
      \ accepts forms a business grammar may forbid (e.g. exponents), so check the\
      \ shape first when the spec restricts it. |\n| Strict dates | `isDate(s, \"\
      yyyy-MM-dd\", \"en.US\", \"UTC\", true)` is false for `2025-02-30` and for `2025-1-1`;\
      \ strict `str2date` with the same arguments **throws** on both. Whether strict\
      \ parsing rejects trailing characters (`2026-01-01x`) is not verified: use an\
      \ explicit whole-string shape check (`s ~= \"[0-9]{4}-[0-9]{2}-[0-9]{2}\"`)\
      \ when the spec requires the exact shape. |\n| Host time zone | Date functions\
      \ without a time-zone argument (`str2date`, `date2str`, `createDate`, `getMonth`,\
      \ `getYear`, …) use the server's default zone, not UTC. For UTC business dates\
      \ pass `\"UTC\"` explicitly, e.g. `getMonth(d, \"UTC\")`, `createDate(2026,\
      \ 1, 1, \"UTC\")`. |\n| Day arithmetic across DST | `dateAdd(d, n, day)` steps\
      \ calendar days in the host time zone, so on a host with DST a UTC-midnight\
      \ value shifts by an hour across the change: `dateAdd(2026-03-30 00:00 UTC,\
      \ -1, day)` = 2026-03-29 **01:00** UTC and `dateAdd(2026-10-26 00:00 UTC, -1,\
      \ day)` = 2026-10-24 **23:00** UTC on a CET host. For UTC calendar days use\
      \ fixed milliseconds, `dateAdd(d, -86400000L, millisec)`, which keeps UTC midnight\
      \ (run 18244). |\n| Rollup emit loop | `updateTransform(counter, …)` and `transform(counter,\
      \ …)` are called repeatedly with `counter` = 0, 1, 2, … until they return `SKIP`.\
      \ To emit one record, return `SKIP` when `counter > 0` (see §8.7). |\n| Denormalizer\
      \ reset | Resetting the group state at the end of `transform()` gives the same\
      \ result as resetting it in `clean()`. |\n| Normalizer | It has exactly one\
      \ output port. `count()` returning 0 emits nothing for that input record; returning\
      \ `SKIP` from `transform(idx)` drops only that child. |\n| DataGenerator | With\
      \ `recordsNumber = 0`, `generate()` is never called. The configured record count\
      \ ends generation; `generate()` returns `OK` / `ALL` on every call. |\n| ExtMergeJoin\
      \ full outer | Matched pairs and one-sided records all go through `transform()`\
      \ and out on output 0; the fields of the absent side read as null. Optional\
      \ output 1 carries unjoined master records unchanged. |\n| ExtMergeJoin absent\
      \ side | In a left-outer ExtMergeJoin, `isnull($in.1)` does **not** detect a\
      \ missing slave record; the absent side's fields read as null, so test a field\
      \ the slave always has (e.g. its non-nullable key: `$in.1.key == null`). A branch\
      \ built on `isnull($in.1)` mis-routes (probe run 5019 failed; the field-level\
      \ test, run 5020, passed — owner's server, SCD-2 set validation). |\n| Joiner\
      \ duplicates disabled | With duplicate keys not allowed (Allow key duplicates\
      \ = false), the joiner keeps the **first** record encountered for each key on\
      \ the duplicated side (run 5021, owner's server). |\n| Lookup duplicates | Iterating\
      \ several records for one key (`get(...)` then `next()`) needs the lookup table's\
      \ `keyDuplicates=true`; `get(...)` returns null on a miss. |\n| Rounding | `round(decimal,\
      \ n)` rounds halves away from zero: `round(2.505D, 2) = 2.51`, `round(-2.505D,\
      \ 2) = -2.51`. |\n| Graph parameters | `RUN_ID` is reserved by the server (it\
      \ is replaced by the numeric execution id); use another name for business run\
      \ ids. |\n| Strings | `length()` counts UTF-16 code units (`length(\"A\U0001F600\
      \") = 3`). `sort()` on a string list is case-sensitive, by UTF-16 code unit\
      \ (upper case before lower case). |\n| DataIntersection | See §8.9: `$out.0`,\
      \ emitted on port 1; `STOP` fails the component. |\n"
