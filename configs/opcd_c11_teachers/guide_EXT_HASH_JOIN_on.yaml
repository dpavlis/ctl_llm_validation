      \ `joinKey` syntax differs**: EXT_HASH_JOIN maps sides with `=` and uses `#`\
      \ to separate slave *ports* (no order suffix); EXT_MERGE_JOIN uses positional\
      \ `<master>#<slave>` sections with `(a)`/`(d)` order suffixes. See `## joinKey\
      \ syntax`.\n\n> **Name vs type:** this doc covers both siblings; emit `type=\"\
      EXT_HASH_JOIN\"` for the in-memory hash join and `type=\"EXT_MERGE_JOIN\"` for\
      \ the sorted-merge mode.\n\n## Purpose & when to use\n\nReach for **EXT_HASH_JOIN**\
      \ when:\n- One side is significantly smaller (fits in memory) — e.g. joining\
      \ a large fact stream against a small reference table.\n- Input is not sorted\
      \ and sorting would be expensive.\n\nReach for **EXT_MERGE_JOIN** when:\n- Both\
      \ sides are large and already sorted (or sorting is acceptable) — avoids the\
      \ memory overhead of hash tables.\n- Input streams arrive from EXT_SORT or a\
      \ sorted DB query.\n\nDon't use either when:\n- You need to join against a static\
      \ in-memory table that never changes between records → use LOOKUP_JOIN.\n- You\
      \ only need to expand/collapse records → use NORMALIZER/DENORMALIZER.\n\n##\
      \ CTL2 contract\n\nSingle entry-point function — the shared Joiners transform\
      \ contract. The physical join strategy differs (hash-table buffering vs sorted\
      \ merge), but the CTL contract is identical.\n\n```ctl\nfunction integer transform()\n\
      ```\n\n**Call order / lifecycle:**\n- `transform()` runs once per produced joined\
      \ row.\n- Return `ALL` to emit on port 0, an output port index to route, or\
      \ `SKIP` to drop the row.\n\n**Port model:**\n- `$in.0` — master / driver record\
      \ (port 0).\n- `$in.1`, `$in.2`, … — slave records (ports 1, 2, …); null for\
      \ left-outer / full-outer rows with no match.\n- `$out.0` — output record.\n\
      \n**Idioms / keep in mind:**\n- For `leftOuter` / `fullOuter`, guard slave-field\
      \ reads with **field-level** null checks on a concrete slave key field, e.g.\
      \ `isnull($in.1.name) ? \"UNKNOWN\" : $in.1.name`. Do **not** use whole-record\
      \ checks like `isnull($in.1)`, and do not use sentinels (`-1`, `\"NONE\"`).\n\
      - Use fields from the correct port — slave-only fields read off `$in.0` cause\
      \ field errors. Driver (left/larger side) on port 0, slave on port 1+.\n- Equality\
      \ operators `==` and `!=` are null-safe; ordered comparisons on nullable values\
      \ need guards.\n\n**Minimal skeleton:**\n```ctl\n//#CTL2\nfunction integer transform()\
      \ {\n    $out.0.id       = $in.0.id;        // $in.0 = driver (port 0)\n   \
      \ $out.0.name     = $in.0.name;\n    $out.0.category = $in.1.category;  // $in.1\
      \ = first slave (port 1)\n    return ALL;\n}\n```\n\nFor `leftOuter` joins,\
      \ slave fields may be null when no match exists:\n```ctl\n//#CTL2\n$out.0.category\
      \ = isnull($in.1.category) ? \"UNKNOWN\" : $in.1.category;\n```\n\n## Examples\n\
      \n### Minimal — left outer join, enrich orders with customer name\n\n```xml\n\
