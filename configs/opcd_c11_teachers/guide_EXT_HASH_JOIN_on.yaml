      ---\n\n# ExtHashJoin\n\n## Description\n\nEXT_HASH_JOIN and EXT_MERGE_JOIN are\
      \ the two standard SQL-style join components. EXT_HASH_JOIN loads the slave\
      \ (right-side) inputs entirely into memory hash tables — no sort required, but\
      \ slave must fit in RAM. EXT_MERGE_JOIN streams both sides — memory-efficient\
      \ for large datasets but requires both inputs to be pre-sorted by the join key.\
