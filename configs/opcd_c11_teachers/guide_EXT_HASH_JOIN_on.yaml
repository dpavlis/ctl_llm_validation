      ---\n\n# ExtHashJoin\n\n## Description\n\nEXT_HASH_JOIN and EXT_MERGE_JOIN are\
      \ the two standard SQL-style join components. EXT_HASH_JOIN loads the slave\
      \ (right-side) inputs entirely into memory hash tables — no sort required, but\
      \ slave must fit in RAM. EXT_MERGE_JOIN streams both sides — memory-efficient\
      \ for large datasets but requires both inputs to be pre-sorted by the join key.\
      \ They share the `joinType` enum and the CTL2 `transform` contract, **but their\
      \ `joinKey` syntax differs**: EXT_HASH_JOIN maps sides with `=` and uses `#`\
      \ to separate slave *ports* (no order suffix); EXT_MERGE_JOIN uses positional\
      \ `<master>#<slave>` sections with `(a)`/`(d)` order suffixes. See `## joinKey\
      \ syntax`.\n\n> **Name vs type:** this doc covers both siblings; emit `type=\"\
      EXT_HASH_JOIN\"` for the in-memory hash join and `type=\"EXT_MERGE_JOIN\"` for\
      \ the sorted-merge mode.\n\n## Purpose & when to use\n\nReach for **EXT_HASH_JOIN**\
      \ when:\n- One side is significantly smaller (fits in memory) — e.g. joining\
      \ a large fact stream against a small reference table.\n- Input is not sorted\
      \ and sorting would be expensive.\n\nReach for **EXT_MERGE_JOIN** when:\n- Both\
      \ sides are large and already sorted (or sorting is acceptable) — avoids the\
      \ memory overhead of hash tables.\n- Input streams arrive from EXT_SORT or a\
      \ sorted DB query.\n\nDon't use either when:\n- You need to join against a static\
      \ in-memory table that never changes between records → use LOOKUP_JOIN.\n- You\
      \ only need to expand/collapse records → use NORMALIZER/DENORMALIZER.\n\n##\
      \ CTL2 contract\n\nSingle entry-point function — the shared Joiners transform\
      \ contract. The physical join strategy differs (hash-table buffering vs sorted\
      \ merge), but the CTL contract is identical.\n\n```ctl\nfunction integer transform()\n\
      ```\n\n**Call order / lifecycle:**\n- `transform()` runs once per produced joined\
      \ row.\n- Return `ALL` to emit on port 0, an output port index to route, or\
      \ `SKIP` to drop the row.\n\n**Port model:**\n- `$in.0` — master / driver record\
      \ (port 0).\n- `$in.1`, `$in.2`, … — slave records (ports 1, 2, …); null for\
      \ left-outer / full-outer rows with no match.\n- `$out.0` — output record.\n\
      \n**Idioms / keep in mind:**\n- For `leftOuter` / `fullOuter`, guard slave-field\
      \ reads with **field-level** null checks on a concrete slave key field, e.g.\
      \ `isnull($in.1.name) ? \"UNKNOWN\" : $in.1.name`. Do **not** use whole-record\
      \ checks like `isnull($in.1)`, and do not use sentinels (`-1`, `\"NONE\"`).\n\
      - Use fields from the correct port — slave-only fields read off `$in.0` cause\
      \ field errors. Driver (left/larger side) on port 0, slave on port 1+.\n- Equality\
      \ operators `==` and `!=` are null-safe; ordered comparisons on nullable values\
      \ need guards.\n\n**Minimal skeleton:**\n```ctl\n//#CTL2\nfunction integer transform()\
      \ {\n    $out.0.id       = $in.0.id;        // $in.0 = driver (port 0)\n   \
      \ $out.0.name     = $in.0.name;\n    $out.0.category = $in.1.category;  // $in.1\
      \ = first slave (port 1)\n    return ALL;\n}\n```\n\nFor `leftOuter` joins,\
      \ slave fields may be null when no match exists:\n```ctl\n//#CTL2\n$out.0.category\
      \ = isnull($in.1.category) ? \"UNKNOWN\" : $in.1.category;\n```\n\n## Examples\n\
      \n### Minimal — left outer join, enrich orders with customer name\n\n```xml\n\
      <Node id=\"JOIN0\" type=\"EXT_HASH_JOIN\"\n      joinKey=\"$customer_id=$id\"\
      \n      joinType=\"leftOuter\"\n      guiName=\"Enrich with customer\" guiX=\"\
      400\" guiY=\"100\">\n  <attr name=\"transform\"><![CDATA[//#CTL2\nfunction integer\
      \ transform() {\n    $out.0.order_id  = $in.0.order_id;\n    $out.0.amount \
      \   = $in.0.amount;\n    $out.0.cust_name = isnull($in.1.name) ? \"UNKNOWN\"\
      \ : $in.1.name;\n    return ALL;\n}\n]]></attr>\n</Node>\n```\n\n### Full —\
      \ Example A: inner join — orders enriched with product names\n\n```xml\n<Node\
      \ id=\"JOIN_PRODUCTS\" type=\"EXT_HASH_JOIN\"\n      joinKey=\"$product_id=$id\"\
      \n      joinType=\"inner\"\n      guiName=\"Join Products\" guiX=\"500\" guiY=\"\
      200\">\n  <attr name=\"transform\"><![CDATA[//#CTL2\nfunction integer transform()\
      \ {\n    $out.0.order_id     = $in.0.order_id;\n    $out.0.product_id   = $in.0.product_id;\n\
      \    $out.0.quantity     = $in.0.quantity;\n    $out.0.product_name = $in.1.name;\n\
      \    $out.0.unit_price   = $in.1.price;\n    return ALL;\n}\n]]></attr>\n</Node>\n\
      ```\n\n### Full — Example B: EXT_MERGE_JOIN — two large sorted datasets\n\n\
      Both sides pre-sorted by `region;year_quarter`. Use EXT_MERGE_JOIN to avoid\
      \ loading a large slave into RAM.\n\n```xml\n<Node id=\"SORT_A\" type=\"EXT_SORT\"\
      \ sortKey=\"region(a);year_quarter(a)\" guiX=\"100\" guiY=\"100\"/>\n<Node id=\"\
      SORT_B\" type=\"EXT_SORT\" sortKey=\"region(a);year_quarter(a)\" guiX=\"100\"\
      \ guiY=\"250\"/>\n\n<Node id=\"MERGE_JOIN\" type=\"EXT_MERGE_JOIN\"\n      joinKey=\"\
      $region(a);$year_quarter(a)#$region(a);$year_quarter(a)\"\n      joinType=\"\
      inner\"\n      guiName=\"Join Regions\" guiX=\"400\" guiY=\"175\">\n  <attr\
      \ name=\"transform\"><![CDATA[//#CTL2\nfunction integer transform() {\n    $out.0.region\
      \       = $in.0.region;\n    $out.0.year_quarter = $in.0.year_quarter;\n   \
      \ $out.0.sales        = $in.0.amount;\n    $out.0.budget       = $in.1.budget;\n\
      \    return ALL;\n}\n]]></attr>\n</Node>\n```\n\n## Common mistakes\n\n- **Forgetting\
      \ to sort inputs before EXT_MERGE_JOIN.** Both inputs must be sorted by the\
      \ join key fields in the same direction. Missing sort → wrong results silently.\n\
      - **Using EXT_HASH_JOIN when the slave is large.** The entire slave is buffered\
      \ in memory. For >~1M records, switch to EXT_MERGE_JOIN + EXT_SORT.\n- **Putting\
      \ `(a)`/`(d)` or `#` in an EXT_HASH_JOIN key.** Hash join maps sides with `=`\
      \ and has no order suffix: write `$id=$id`, not `$id(a)#$id(a)`. An `(a)` is\
      \ read as part of the field name (`id(a)` → \"field doesn't exist\"), and a\
      \ `#` starts a second slave port. The `(a)/(d)` + positional `#` form belongs\
      \ to EXT_MERGE_JOIN only.\n- **Port 0 vs port 1 confusion.** Driver (left/larger\
      \ side) on port 0, slave on port 1+. Swapping makes the hash table much larger.\n\
      - **Accessing slave fields without null-checking on `leftOuter`.** Unmatched\
      \ driver records emit null for slave fields. Wrap `$in.1.field` reads with `isnull(...)\
      \ ? default : ...` (check a concrete field, not the whole `$in.1` record).\n\
      - **Using deprecated `leftOuterJoin=\"true\"`.** Silently ignored; use `joinType=\"\
      leftOuter\"`.\n\n# Reference: verified runtime behaviour\n\n### 13.3 Runtime\
      \ behaviour verified on the server (live runs, 2026-10-13)\n\nFacts settled\
      \ by running graphs on CloverDX Server 7.4 (run ids in `data/suite_v5/validation_report.json`).\
      \ They decide whether code works at runtime, not only whether it compiles.\n\
      \n| Topic | Verified behaviour |\n|---|---|\n| Empty string to number | `str2decimal(\"\
      \")` **throws** (it does not return null). Guard blank text before converting,\
      \ or use the conditional-fail form `str2decimal(s) : null`. `str2decimal` also\
      \ accepts forms a business grammar may forbid (e.g. exponents), so check the\
      \ shape first when the spec restricts it. |\n| Strict dates | `isDate(s, \"\
      yyyy-MM-dd\", \"en.US\", \"UTC\", true)` is false for `2025-02-30` and for `2025-1-1`;\
      \ strict `str2date` with the same arguments **throws** on both. Whether strict\
      \ parsing rejects trailing characters (`2026-01-01x`) is not verified: use an\
      \ explicit whole-string shape check (`s ~= \"[0-9]{4}-[0-9]{2}-[0-9]{2}\"`)\
      \ when the spec requires the exact shape. |\n| Host time zone | Date functions\
      \ without a time-zone argument (`str2date`, `date2str`, `createDate`, `getMonth`,\
      \ `getYear`, …) use the server's default zone, not UTC. For UTC business dates\
      \ pass `\"UTC\"` explicitly, e.g. `getMonth(d, \"UTC\")`, `createDate(2026,\
      \ 1, 1, \"UTC\")`. |\n| Day arithmetic across DST | `dateAdd(d, n, day)` steps\
      \ calendar days in the host time zone, so on a host with DST a UTC-midnight\
      \ value shifts by an hour across the change: `dateAdd(2026-03-30 00:00 UTC,\
      \ -1, day)` = 2026-03-29 **01:00** UTC and `dateAdd(2026-10-26 00:00 UTC, -1,\
      \ day)` = 2026-10-24 **23:00** UTC on a CET host. For UTC calendar days use\
      \ fixed milliseconds, `dateAdd(d, -86400000L, millisec)`, which keeps UTC midnight\
      \ (run 18244). |\n| Rollup emit loop | `updateTransform(counter, …)` and `transform(counter,\
      \ …)` are called repeatedly with `counter` = 0, 1, 2, … until they return `SKIP`.\
      \ To emit one record, return `SKIP` when `counter > 0` (see §8.7). |\n| Denormalizer\
      \ reset | Resetting the group state at the end of `transform()` gives the same\
      \ result as resetting it in `clean()`. |\n| Normalizer | It has exactly one\
      \ output port. `count()` returning 0 emits nothing for that input record; returning\
      \ `SKIP` from `transform(idx)` drops only that child. |\n| DataGenerator | With\
      \ `recordsNumber = 0`, `generate()` is never called. The configured record count\
      \ ends generation; `generate()` returns `OK` / `ALL` on every call. |\n| ExtMergeJoin\
      \ full outer | Matched pairs and one-sided records all go through `transform()`\
      \ and out on output 0; the fields of the absent side read as null. Optional\
      \ output 1 carries unjoined master records unchanged. |\n| ExtMergeJoin absent\
      \ side | In a left-outer ExtMergeJoin, `isnull($in.1)` does **not** detect a\
      \ missing slave record; the absent side's fields read as null, so test a field\
      \ the slave always has (e.g. its non-nullable key: `$in.1.key == null`). A branch\
      \ built on `isnull($in.1)` mis-routes (probe run 5019 failed; the field-level\
      \ test, run 5020, passed — owner's server, SCD-2 set validation). |\n| Joiner\
      \ duplicates disabled | With duplicate keys not allowed (Allow key duplicates\
      \ = false), the joiner keeps the **first** record encountered for each key on\
      \ the duplicated side (run 5021, owner's server). |\n| Lookup duplicates | Iterating\
      \ several records for one key (`get(...)` then `next()`) needs the lookup table's\
      \ `keyDuplicates=true`; `get(...)` returns null on a miss. |\n| Rounding | `round(decimal,\
      \ n)` rounds halves away from zero: `round(2.505D, 2) = 2.51`, `round(-2.505D,\
      \ 2) = -2.51`. |\n| Graph parameters | `RUN_ID` is reserved by the server (it\
      \ is replaced by the numeric execution id); use another name for business run\
      \ ids. |\n| Strings | `length()` counts UTF-16 code units (`length(\"A\U0001F600\
      \") = 3`). `sort()` on a string list is case-sensitive, by UTF-16 code unit\
      \ (upper case before lower case). |\n| DataIntersection | See §8.9: `$out.0`,\
      \ emitted on port 1; `STOP` fails the component. |\n"
