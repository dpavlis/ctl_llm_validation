      \ `transform`.** They are output *loops* — `ALL` emits and CloverDX re-calls\
      \ with `counter`+1; only `SKIP` stops them, so an unconditional `ALL` produces\
      \ infinite output. Emit on the counters you need, then `return SKIP`.\n- **Mutating\
      \ `$in.0` in `transform`.** It reflects the last record of the group and is\
      \ read-only there — capture earlier records into the accumulator.\n- **Adding\
      \ a trailing boolean to `transform`.** The signature is `transform(integer counter,\
      \ Acc acc)` — no `boolean last` parameter.\n\n# Reference: verified runtime\
      \ behaviour\n\n### 13.3 Runtime behaviour verified on the server (live runs,\
      \ 2026-10-13)\n\nFacts settled by running graphs on CloverDX Server 7.4 (run\
      \ ids in `data/suite_v5/validation_report.json`). They decide whether code works\
      \ at runtime, not only whether it compiles.\n\n| Topic | Verified behaviour\
      \ |\n|---|---|\n| Empty string to number | `str2decimal(\"\")` **throws** (it\
      \ does not return null). Guard blank text before converting, or use the conditional-fail\
      \ form `str2decimal(s) : null`. `str2decimal` also accepts forms a business\
      \ grammar may forbid (e.g. exponents), so check the shape first when the spec\
      \ restricts it. |\n| Strict dates | `isDate(s, \"yyyy-MM-dd\", \"en.US\", \"\
      UTC\", true)` is false for `2025-02-30` and for `2025-1-1`; strict `str2date`\
      \ with the same arguments **throws** on both. Whether strict parsing rejects\
      \ trailing characters (`2026-01-01x`) is not verified: use an explicit whole-string\
      \ shape check (`s ~= \"[0-9]{4}-[0-9]{2}-[0-9]{2}\"`) when the spec requires\
      \ the exact shape. |\n| Host time zone | Date functions without a time-zone\
      \ argument (`str2date`, `date2str`, `createDate`, `getMonth`, `getYear`, …)\
      \ use the server's default zone, not UTC. For UTC business dates pass `\"UTC\"\
      ` explicitly, e.g. `getMonth(d, \"UTC\")`, `createDate(2026, 1, 1, \"UTC\")`.\
      \ |\n| Day arithmetic across DST | `dateAdd(d, n, day)` steps calendar days\
      \ in the host time zone, so on a host with DST a UTC-midnight value shifts by\
      \ an hour across the change: `dateAdd(2026-03-30 00:00 UTC, -1, day)` = 2026-03-29\
      \ **01:00** UTC and `dateAdd(2026-10-26 00:00 UTC, -1, day)` = 2026-10-24 **23:00**\
      \ UTC on a CET host. For UTC calendar days use fixed milliseconds, `dateAdd(d,\
      \ -86400000L, millisec)`, which keeps UTC midnight (run 18244). |\n| Rollup\
      \ emit loop | `updateTransform(counter, …)` and `transform(counter, …)` are\
      \ called repeatedly with `counter` = 0, 1, 2, … until they return `SKIP`. To\
      \ emit one record, return `SKIP` when `counter > 0` (see §8.7). |\n| Denormalizer\
      \ reset | Resetting the group state at the end of `transform()` gives the same\
      \ result as resetting it in `clean()`. |\n| Normalizer | It has exactly one\
      \ output port. `count()` returning 0 emits nothing for that input record; returning\
      \ `SKIP` from `transform(idx)` drops only that child. |\n| DataGenerator | With\
      \ `recordsNumber = 0`, `generate()` is never called. The configured record count\
      \ ends generation; `generate()` returns `OK` / `ALL` on every call. |\n| ExtMergeJoin\
      \ full outer | Matched pairs and one-sided records all go through `transform()`\
      \ and out on output 0; the fields of the absent side read as null. Optional\
      \ output 1 carries unjoined master records unchanged. |\n| Lookup duplicates\
      \ | Iterating several records for one key (`get(...)` then `next()`) needs the\
      \ lookup table's `keyDuplicates=true`; `get(...)` returns null on a miss. |\n\
      | Rounding | `round(decimal, n)` rounds halves away from zero: `round(2.505D,\
      \ 2) = 2.51`, `round(-2.505D, 2) = -2.51`. |\n| Graph parameters | `RUN_ID`\
      \ is reserved by the server (it is replaced by the numeric execution id); use\
      \ another name for business run ids. |\n| Strings | `length()` counts UTF-16\
      \ code units (`length(\"A\U0001F600\") = 3`). `sort()` on a string list is case-sensitive,\
      \ by UTF-16 code unit (upper case before lower case). |\n| DataIntersection\
      \ | See §8.9: `$out.0`, emitted on port 1; `STOP` fails the component. |\n"
