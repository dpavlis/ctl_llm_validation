      \ debug, and explain CTL2 code and related concepts. Provide working code, explanation,\
      \ or both as needed.\nPrefer correct, practical, minimal solutions.\nDeclaration\
      \ defaults in CTL2: a variable declared without an initializer, global or local,\
      \ starts at its type's default, not null:\ninteger/long/decimal 0, number 0.0,\
      \ boolean false, string \"\", date the epoch, lists and maps empty; only variant,\
      \ byte and cbyte start null.\nUnlike Java and C#, such a variable needs no null\
      \ guard before its first use. This covers declared variables only:\nrecord fields\
      \ (input, output, Rollup accumulator) follow their metadata, so a nullable field\
      \ without a default value is null until assigned.\nMetadata fields are nullable\
      \ unless marked nullable=\"false\".\n\n# Reference: the component you are writing\
      \ for\n\n---\nname: Rollup\ntype: ROLLUP\ndescription: Group-by + custom CTL2\
      \ lifecycle (initGroup, updateGroup, finishGroup, transform). More flexible\
      \ than AGGREGATE; multi-output ports.\ntags: [component, transformer, rollup,\
      \ group-by, ctl2, accumulator, multi-output]\nscope: install\nprovenance: human-curated\n\
      sections: [description, purpose, xml, properties, ports, ctl, examples, mistakes]\n\
      ---\n\n# Rollup\n\n## Description\n\nGroups input by an optional key, runs a\
      \ per-group CTL2 lifecycle (`initGroup` → `updateGroup` per record → `finishGroup`\
      \ → `transform`), and emits one or more records per group to one or more output\
      \ ports. More expressive than AGGREGATE — the right choice when group reduction\
      \ is custom (not just SUM/COUNT/AVG) or when you need multi-port routing per\
      \ group.\n\n## Purpose & when to use\n\nReach for ROLLUP when:\n- Per-group\
      \ reduction is custom (collect into a list, build a JSON, conditional accumulation).\n\
      - You need multiple output records per group, possibly to different ports.\n\
      - You're \"exploding\" multi-value fields into normalized child records.\n\n\
      Don't use ROLLUP when:\n- Standard SUM/COUNT/AVG/MIN/MAX is enough → use AGGREGATE\
      \ (declarative, no CTL).\n- You need straightforward N:1 collapsing → use DENORMALIZER.\n\
      \n## CTL2 contract\n\nFive entry-point functions. **Exact signatures — `transform()`\
      \ has NO trailing boolean parameter:**\n\n```ctl\nfunction void    initGroup(Acc\
      \ acc)\nfunction boolean  updateGroup(Acc acc)\nfunction boolean  finishGroup(Acc\
      \ acc)\nfunction integer  updateTransform(integer counter, Acc acc)\nfunction\
      \ integer  transform(integer counter, Acc acc)\n```\n\n**Call order / lifecycle:**\n\
      - `initGroup` — once per group (first record).\n- `updateGroup` — once per input\
      \ record in the group. Return `true` to invoke `updateTransform` for that record;\
      \ `false` to skip it (typical — accumulate, emit at `finishGroup`).\n- `updateTransform(counter,\
      \ acc)` — runs only after an `updateGroup` that returned `true`; use to emit\
      \ one record per input record.\n- `finishGroup` — once after the group's input\
      \ is consumed. Return `true` to invoke `transform`.\n- `transform(counter, acc)`\
      \ — runs after `finishGroup` returns `true`; `counter` is the call's ordinal\
      \ within the group (0, 1, 2 …). Build the per-group output here.\n\nOptional:\
      \ `init()`, `preExecute()`, `postExecute()`, plus `*OnError` functions.\n\n\
      **Port model:** one input (`$in.0`), one or more outputs (`$out.N`), and one\
      \ accumulator argument. Write `$out` only in `updateTransform` / `transform`,\
      \ never in `updateGroup`.\n\n**Idioms / keep in mind:**\n- Initialize **every**\
      \ accumulator field in `initGroup` — null arithmetic throws.\n- `$in.0` inside\
      \ `transform` reflects the **last** record of the group and is read-only there;\
      \ capture earlier records into the accumulator during `updateGroup`.\n- Guard\
      \ divide-by-zero in `finishGroup` when computing averages.\n- **`updateTransform`\
      \ / `transform` are output-generation loops, not single-shot callbacks.** CloverDX\
      \ calls them repeatedly with `counter = 0, 1, 2, …`; returning `ALL` (or a port\
      \ number) **emits the row and continues** the loop — **only `SKIP` ends it**.\
      \ (`counter` is the ordinal of *generated output rows*, not an input-row index.)\n\
      - For one-row-per-group output, guard with `if (counter > 0) return SKIP;` —\
      \ an unconditional `return ALL` here loops forever.\n\n**Minimal skeleton:**\n\
      ```ctl\n//#CTL2\nfunction void initGroup(OrderAcc acc) {\n    acc.count = 0;\n\
      \    acc.totalFreight = 0.0d;\n}\nfunction boolean updateGroup(OrderAcc acc)\
      \ {\n    acc.count = acc.count + 1;\n    acc.totalFreight = acc.totalFreight\
      \ + $in.0.freight;\n    return false;                       // emit at finishGroup,\
      \ not per record\n}\nfunction integer updateTransform(integer counter, OrderAcc\
      \ acc) {\n    return SKIP;                        // not used here\n}\nfunction\
      \ boolean finishGroup(OrderAcc acc) {\n    return true;\n}\nfunction integer\
      \ transform(integer counter, OrderAcc acc) {\n    $out.0.customer_id   = $in.0.customer_id;\n\
      \    $out.0.order_count   = acc.count;\n    $out.0.total_freight = acc.totalFreight;\n\
      \    return ALL;\n}\n```\n\n## Examples\n\n### Minimal — count + sum per customer\n\
      \n```xml\n<Metadata id=\"META_ACC\">\n  <Record name=\"OrderAcc\" type=\"delimited\"\
      >\n    <Field name=\"count\"        type=\"integer\"/>\n    <Field name=\"totalFreight\"\
      \ type=\"decimal\"/>\n  </Record>\n</Metadata>\n\n<Node id=\"ROLLUP0\" type=\"\
      ROLLUP\"\n      groupKeyFields=\"customer_id\"\n      groupAccumulatorMetadataId=\"\
      META_ACC\"\n      inputSorted=\"true\"\n      guiX=\"500\" guiY=\"200\">\n \
      \ <attr name=\"transform\"><![CDATA[//#CTL2\nfunction void initGroup(OrderAcc\
      \ acc) {\n    acc.count = 0;\n    acc.totalFreight = 0.0d;\n}\nfunction boolean\
      \ updateGroup(OrderAcc acc) {\n    acc.count = acc.count + 1;\n    acc.totalFreight\
      \ = acc.totalFreight + $in.0.freight;\n    return false;\n}\nfunction integer\
      \ updateTransform(integer counter, OrderAcc acc) {\n    return SKIP;\n}\nfunction\
      \ boolean finishGroup(OrderAcc acc) {\n    return true;\n}\nfunction integer\
      \ transform(integer counter, OrderAcc acc) {\n    $out.0.customer_id   = $in.0.customer_id;\n\
      \    $out.0.order_count   = acc.count;\n    $out.0.total_freight = acc.totalFreight;\n\
      \    return ALL;\n}\n]]></attr>\n</Node>\n```\n\n### Detail + summary — one\
      \ row per input record plus a group total\n\nWhen `updateGroup` returns `true`,\
      \ `updateTransform` fires for that record — emit a DETAIL row there; `finishGroup`\
      \ returning `true` then triggers `transform` for the group SUMMARY. The `if\
      \ (counter > 0) return SKIP;` guard in both caps each at one row (drop it and\
      \ they loop forever). Both row types go to port 0, distinguished by a `record_type`\
      \ field, so the output metadata is the superset of both shapes.\n\n```xml\n\
      <Metadata id=\"META_DETAIL_ACC\">\n  <Record name=\"DetailAcc\" type=\"delimited\"\
      >\n    <Field name=\"count\"      type=\"integer\"/>\n    <Field name=\"total\"\
      \      type=\"decimal\"/>\n    <Field name=\"cur_amount\" type=\"decimal\"/>\n\
      \    <Field name=\"avg\"        type=\"decimal\"/>\n  </Record>\n</Metadata>\n\
      \n<Node id=\"ROLLUP_DETAIL\" type=\"ROLLUP\"\n      groupKeyFields=\"customer_id\"\
      \n      groupAccumulatorMetadataId=\"META_DETAIL_ACC\"\n      inputSorted=\"\
      true\"\n      guiX=\"500\" guiY=\"350\">\n  <attr name=\"transform\"><![CDATA[//#CTL2\n\
      function void initGroup(DetailAcc acc) {\n    acc.count = 0;\n    acc.total\
      \ = 0.0d;\n    acc.cur_amount = 0.0d;\n}\nfunction boolean updateGroup(DetailAcc\
      \ acc) {\n    acc.count = acc.count + 1;\n    acc.cur_amount = $in.0.amount;\n\
      \    acc.total = acc.total + $in.0.amount;\n    return true;               \
      \           // fire updateTransform for this record\n}\nfunction integer updateTransform(integer\
      \ counter, DetailAcc acc) {\n    if (counter > 0) return SKIP;         // one\
      \ DETAIL row per input record\n    $out.0.record_type = \"DETAIL\";\n    $out.0.amount\
      \ = acc.cur_amount;\n    return ALL;\n}\nfunction boolean finishGroup(DetailAcc\
      \ acc) {\n    acc.avg = acc.count == 0 ? 0.0d : acc.total / acc.count;\n   \
      \ return true;                          // fire transform for the group summary\n\
      }\nfunction integer transform(integer counter, DetailAcc acc) {\n    if (counter\
      \ > 0) return SKIP;         // one SUMMARY row per group\n    $out.0.record_type\
      \ = \"SUMMARY\";\n    $out.0.count = acc.count;\n    $out.0.total = acc.total;\n\
      \    $out.0.avg   = acc.avg;\n    return ALL;\n}\n]]></attr>\n</Node>\n```\n\
      \n## Common mistakes\n\n- **`inputSorted=\"true\"` (default) with unsorted input.**\
      \ Group boundaries are detected by key change. Always sort by `groupKeyFields`\
      \ upstream OR set `inputSorted=\"false\"`.\n- **Forgetting `groupAccumulatorMetadataId`\
      \ metadata when accumulating state.** Without it, `VoidMetadata` is used and\
      \ nothing can be stored across `updateGroup` calls.\n- **Returning `true` from\
      \ `updateGroup` when not using `updateTransform`.** Causes an unwanted call.\
      \ Default to `false`.\n- **Unconditional `return ALL` in `updateTransform` /\
      \ `transform`.** They are output *loops* — `ALL` emits and CloverDX re-calls\
      \ with `counter`+1; only `SKIP` stops them, so an unconditional `ALL` produces\
      \ infinite output. Emit on the counters you need, then `return SKIP`.\n- **Mutating\
      \ `$in.0` in `transform`.** It reflects the last record of the group and is\
      \ read-only there — capture earlier records into the accumulator.\n- **Adding\
      \ a trailing boolean to `transform`.** The signature is `transform(integer counter,\
      \ Acc acc)` — no `boolean last` parameter.\n\n# Reference: verified runtime\
      \ behaviour\n\n### 13.3 Runtime behaviour verified on the server (live runs,\
