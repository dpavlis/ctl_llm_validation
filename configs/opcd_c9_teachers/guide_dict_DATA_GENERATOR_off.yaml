      \ functions.\n- Writes generated records to one or more output ports (`$out.0`,\
      \ `$out.1`, …).\n\n**(d) Return semantics & idioms — keep in mind:**\n- Return\
      \ values from `generate()`:\n  - `ALL` / `OK` / `0` — emit on port 0.\n  - an\
      \ integer port number — emit on that port (multi-port generation).\n  - `SKIP`\
      \ — drop this record (does **not** count against `recordsNumber`).\n  - `STOP`\
      \ — stops generation immediately, but is treated as an **abort, not a graceful\
      \ end-of-stream**. It is an advanced way to control the ending from CTL; **prefer\
      \ bounding the run with `recordsNumber`** for normal use.\n- Module-level counters\
      \ / state are expected here (unlike most transforms) — declare them at module\
      \ scope and increment across calls.\n- `++` is valid on module/local variables\
      \ in DATA_GENERATOR CTL (it is the natural way to advance a counter).\n- For\
