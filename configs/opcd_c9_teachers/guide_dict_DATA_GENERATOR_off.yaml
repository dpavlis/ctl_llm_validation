      \ call `setRandomSeed(seed)` from `init()` or `preExecute()`.\n\n**(e) Minimal\
      \ correct skeleton:**\n\n```ctl\n//#CTL2\ninteger i = 0;\nfunction integer generate()\
      \ {\n    $out.0.id = i;        // recordsNumber on the node bounds the count\n\
      \    i++;\n    return OK;\n}\n```\n\n**(f) Canonical mistake:**\n- Wrong: expecting\
      \ `$in.0` inside DATA_GENERATOR — there is no input port.\n- Correct: generate\
      \ from module-level state, constants, sequences, and random functions.\n\n**Optional\
      \ lifecycle functions:**\n\n```ctl\nfunction boolean init() { /* setup */ return\
      \ true; }\nfunction void preExecute()  { /* per-run setup */ }\nfunction void\
      \ postExecute() { /* per-run teardown */ }\nfunction integer generateOnError(string\
      \ errorMessage, string stackTrace) {\n    // recover from generate() failure\n\
      \    return SKIP;\n}\n```\n\n## Examples\n\n### Minimal — random sales records\n\
      \n```xml\n<Node id=\"GEN0\" type=\"DATA_GENERATOR\" recordsNumber=\"500\">\n\
      \  <attr name=\"generate\"><![CDATA[//#CTL2\nfunction integer generate() {\n\
      \    $out.0.branch_id   = (sequence(SEQ0).next() % 10) + 1;\n    $out.0.product\
      \     = randomString(5, 10);\n    $out.0.quantity    = randomInteger(1, 50);\n\
      \    $out.0.unit_price  = randomDouble() * 100;\n    $out.0.sale_date   = today();\n\
      \    return ALL;\n}\n]]></attr>\n</Node>\n```\n\n### Full — fan-out to multiple\
      \ files\n\nGenerate 500 records, distribute across 10 output files keyed by\
      \ `branch_id`. The canonical CloverDX pattern is **writer-side partitioning**\
      \ — one writer configured with a partition key and `#` placeholder in the output\
      \ file path. PARTITION-the-component is **not** needed for fan-out by key.\n\
      \n#### Preferred — writer-side partitioning (one writer, N files)\n\n```xml\n\
      <Node id=\"GEN0\" type=\"DATA_GENERATOR\" recordsNumber=\"500\">\n  <attr name=\"\
      generate\"><![CDATA[//#CTL2\nconst string[] PRODUCTS = [\"Rose\",\"Tulip\",\"\
      Sunflower\",\"Lily\",\"Orchid\",\"Daisy\",\"Carnation\",\"Lavender\"];\n\nfunction\
      \ integer generate() {\n    $out.0.branch_id   = (sequence(SEQ0).next() % 10)\
      \ + 1;\n    $out.0.product     = PRODUCTS[randomInteger(0, length(PRODUCTS)\
      \ - 1)];\n    $out.0.quantity    = randomInteger(1, 50);\n    $out.0.unit_price\
      \  = randomDouble() * 100;\n    return ALL;\n}\n]]></attr>\n</Node>\n\n<Node\
      \ id=\"WRITER0\" type=\"FLAT_FILE_WRITER\"\n      fileURL=\"${DATAOUT_DIR}/branches/branch_#.csv\"\
      \n      partitionKey=\"branch_id\"\n      partitionFileTag=\"keyNameFileTag\"\
      \n      outputFieldNames=\"true\"\n      makeDirs=\"true\"/>\n\n<Edge id=\"\
      E0\" fromNode=\"GEN0:0\" toNode=\"WRITER0:0\" metadata=\"Sales\"/>\n```\n\n\
      The `#` placeholder in the writer output path becomes each distinct `branch_id`\
      \ value (`branch_1.csv` … `branch_10.csv`). One writer node, no PARTITION component,\
      \ no manual N-port wiring. See `csv-file` § *Native file partitioning* for the\
      \ full attribute reference.\n\n#### Alternative — PARTITION component (only\
      \ when each output needs different logic)\n\nReach for the PARTITION component\
      \ **only** when each output port needs a genuinely different downstream — different\
      \ metadata, different transform, different sink type. Don't use it just to split\
      \ into N similar files.\n\n```xml\n<Node id=\"PART0\" type=\"PARTITION\">\n\
      \  <attr name=\"partitionSource\"><![CDATA[//#CTL2\nfunction integer getOutputPort()\
      \ {\n    return $in.0.branch_id - 1;  // route to ports 0..9\n}\n]]></attr>\n\
