      provenance: human-curated\nsections: [description, purpose, xml, properties,\
      \ ports, ctl, examples, mistakes]\n---\n\n# Data Generator\n\n## Description\n\
      \nSource component that generates records via a CTL2 (or Java) `generate()`\
