      sections: [description, purpose, xml, properties, ports, ctl, examples, mistakes]\n\
      ---\n\n# Denormalizer\n\n## Description\n\nMerges multiple records into fewer,\
      \ grouped by key — each group emits one output record built from accumulator\
      \ state. The N:1 inverse of NORMALIZER. Requires input sorted by the key fields.\n\
      \n## Purpose & when to use\n\nReach for DENORMALIZER when:\n- You need per-group\
      \ reductions beyond AGGREGATE's built-in functions (e.g. concatenate strings,\
      \ custom logic).\n- You need to accumulate state across all rows of a group,\
      \ then emit one summary row.\n- The reduction logic is genuinely custom — comma-joining\
      \ names, building a JSON array per group, computing weighted averages with conditions.\n\
      \nDon't use DENORMALIZER when:\n- Standard SUM/COUNT/AVG/MIN/MAX is enough →\
      \ use AGGREGATE (declarative mapping, no CTL).\n- Input isn't sorted by the\
      \ group key → sort first, or use AGGREGATE with `sorted=\"false\"`.\n\n## CTL2\
      \ contract\n\nThree entry-point functions:\n\n```ctl\nfunction integer append()\
      \    // per input record in the group\nfunction integer transform() // once\
      \ at end of group — build the output\nfunction void    clean()     // between\
      \ groups — reset all accumulators\n```\n\n**Call order / lifecycle:**\n- `append()`\
      \ — runs for each record in the current group; accumulate into module-level\
      \ variables. Returns `OK` (counted) or `SKIP` (skip this record's contribution).\n\
      - `transform()` — runs once after the group's input is consumed; build the output\
      \ record from accumulator state. Returns `ALL` (port 0), a specific port number,\
      \ or **`SKIP` to emit no row for the group**. (Single-shot — no counter loop,\
      \ unlike ROLLUP's `transform`.)\n- `clean()` — runs after `transform()` to reset\
      \ module state before the next group.\n\n**Port model:** one input (`$in.0`),\
      \ one or more outputs (`$out.N`). Read input per-record in `append()`; build\
      \ output in `transform()`. (`$in.0` is still readable in `transform()` but reflects\
      \ only the **last record of the group** — accumulate in `append()` rather than\
      \ depending on it.)\n\n**Idioms / keep in mind:**\n- Keep group state in **module-level\
      \ variables** (declared outside the functions); they persist across `append()`\
      \ calls within a group.\n- **Reset every module-level variable in `clean()`**\
      \ — otherwise state bleeds into the next group.\n- Don't access `$out` in `append()`.\
      \ In `transform()`, `$in.0` reflects the **last record of the group** (that's\
      \ the defined behavior, not a recommendation to use it) — accumulate what you\
      \ need during `append()`.\n- **Initialize accumulators at declaration; don't\
      \ use `isnull()` on a module variable to detect the first record.** Module-level\
      \ variables are **not** null by default — CTL2 default-initializes them by type\
      \ (`integer`/`long`/`number`/`decimal` → `0`, `string` → `\"\"`, `boolean` →\
      \ `false`, `date` → epoch, `list`/`map` → empty). So `if (isnull(acc)) …` on\
      \ a module variable **never fires** (it is already `0`/`\"\"`), and a group\
      \ key captured that way keeps its default — the first group comes out with `order_id\
      \ = 0`. What *can* be null is an **input field** (`$in.0.amount`); guard those\
      \ with `nvl(...)`. Initialize numeric accumulators at declaration (`decimal\
      \ total = 0.0;`) and accumulate with `total = total + nvl($in.0.amount, 0.0);`.\
      \ To carry the group key, read it in `transform()` (`$out.0.key = $in.0.key;`\
      \ — `$in.0` is the group's last record and the key is constant within a group)\
      \ or assign it unconditionally in `append()` (`groupKey = $in.0.key;`); use\
      \ an explicit `boolean first = true;` flag if you genuinely need first-record-only\
      \ logic.\n\n**Minimal skeleton:**\n```ctl\n//#CTL2\nstring allNames = \"\";\n\
      integer cnt = 0;\n\nfunction integer append() {\n    if (length(allNames) >\
      \ 0) allNames = allNames + \", \";\n    allNames = allNames + $in.0.name;\n\
      \    cnt = cnt + 1;\n    return OK;\n}\nfunction integer transform() {\n   \
      \ $out.0.category = $in.0.category;\n    $out.0.names    = allNames;\n    $out.0.count\
      \    = cnt;\n    return ALL;\n}\nfunction void clean() {\n    allNames = \"\"\
      ;\n    cnt = 0;\n}\n```\n\n## Examples\n\n### Full — concatenate names per category\n\
      \n```xml\n<Node id=\"DENORMALIZER0\" type=\"DENORMALIZER\" key=\"category\"\n\
      \      guiX=\"400\" guiY=\"200\">\n  <attr name=\"denormalize\"><![CDATA[//#CTL2\n\
      \nstring allNames = \"\";\ninteger cnt = 0;\n\nfunction integer append() {\n\
      \    if (length(allNames) > 0) allNames = allNames + \", \";\n    allNames =\
      \ allNames + $in.0.name;\n    cnt = cnt + 1;\n    return OK;\n}\n\nfunction\
      \ integer transform() {\n    $out.0.category = $in.0.category;\n    $out.0.names\
      \    = allNames;\n    $out.0.count    = cnt;\n    return ALL;\n}\n\nfunction\
      \ void clean() {\n    allNames = \"\";\n    cnt = 0;\n}\n]]></attr>\n</Node>\n\
      ```\n\n## Common mistakes\n\n- **Unsorted input.** Group boundaries are detected\
      \ by key change; unsorted input fragments a single key into multiple \"groups\"\
      . Always EXT_SORT upstream on the `key`.\n- **Forgetting the `clean()` reset.**\
      \ Accumulators carry over between groups → results bleed. Every module-level\
      \ variable must be reset in `clean()`.\n- **Relying on `$in.0` in `transform()`.**\
      \ It reflects the last record of the group — fine to read, but fragile to depend\
      \ on; capture state into module-level accumulators during `append()`.\n- **Writing\
      \ `$out` in `append()` or reading `$in` in `transform()`.** Stick to the port\
      \ model: input in `append()`, output in `transform()`.\n- **Using `isnull()`\
      \ on a module variable to detect the first record or capture a group key.**\
      \ Module-level accumulators are **not** null by default — CTL2 initializes them\
      \ by type (`integer`/`long`/`number`/`decimal` → `0`, `string` → `\"\"`, `boolean`\
      \ → `false`). So `if (isnull(groupKey)) groupKey = $in.0.key;` never fires and\
      \ the first group keeps the default (e.g. `order_id` is emitted as `0`). Capture\
      \ the key in `transform()` from `$in.0` (constant within the group) or assign\
      \ it unconditionally in `append()`. Only **input fields** (`$in.0.x`) can be\
      \ null — guard those with `nvl(...)`.\n\n# Reference: verified runtime behaviour\n\
      \n### 13.3 Runtime behaviour verified on the server (live runs, 2026-10-13)\n\
      \nFacts settled by running graphs on CloverDX Server 7.4 (run ids in `data/suite_v5/validation_report.json`).\
      \ They decide whether code works at runtime, not only whether it compiles.\n\
      \n| Topic | Verified behaviour |\n|---|---|\n| Empty string to number | `str2decimal(\"\
      \")` **throws** (it does not return null). Guard blank text before converting,\
      \ or use the conditional-fail form `str2decimal(s) : null`. `str2decimal` also\
      \ accepts forms a business grammar may forbid (e.g. exponents), so check the\
      \ shape first when the spec restricts it. |\n| Strict dates | `isDate(s, \"\
      yyyy-MM-dd\", \"en.US\", \"UTC\", true)` is false for `2025-02-30` and for `2025-1-1`;\
      \ strict `str2date` with the same arguments **throws** on both. Whether strict\
      \ parsing rejects trailing characters (`2026-01-01x`) is not verified: use an\
      \ explicit whole-string shape check (`s ~= \"[0-9]{4}-[0-9]{2}-[0-9]{2}\"`)\
      \ when the spec requires the exact shape. |\n| Host time zone | Date functions\
      \ without a time-zone argument (`str2date`, `date2str`, `createDate`, `getMonth`,\
      \ `getYear`, …) use the server's default zone, not UTC. For UTC business dates\
      \ pass `\"UTC\"` explicitly, e.g. `getMonth(d, \"UTC\")`, `createDate(2026,\
      \ 1, 1, \"UTC\")`. |\n| Day arithmetic across DST | `dateAdd(d, n, day)` steps\
      \ calendar days in the host time zone, so on a host with DST a UTC-midnight\
      \ value shifts by an hour across the change: `dateAdd(2026-03-30 00:00 UTC,\
      \ -1, day)` = 2026-03-29 **01:00** UTC and `dateAdd(2026-10-26 00:00 UTC, -1,\
      \ day)` = 2026-10-24 **23:00** UTC on a CET host. For UTC calendar days use\
      \ fixed milliseconds, `dateAdd(d, -86400000L, millisec)`, which keeps UTC midnight\
      \ (run 18244). |\n| Rollup emit loop | `updateTransform(counter, …)` and `transform(counter,\
      \ …)` are called repeatedly with `counter` = 0, 1, 2, … until they return `SKIP`.\
      \ To emit one record, return `SKIP` when `counter > 0` (see §8.7). |\n| Denormalizer\
      \ reset | Resetting the group state at the end of `transform()` gives the same\
      \ result as resetting it in `clean()`. |\n| Normalizer | It has exactly one\
      \ output port. `count()` returning 0 emits nothing for that input record; returning\
      \ `SKIP` from `transform(idx)` drops only that child. |\n| DataGenerator | With\
      \ `recordsNumber = 0`, `generate()` is never called. The configured record count\
      \ ends generation; `generate()` returns `OK` / `ALL` on every call. |\n| ExtMergeJoin\
      \ full outer | Matched pairs and one-sided records all go through `transform()`\
      \ and out on output 0; the fields of the absent side read as null. Optional\
      \ output 1 carries unjoined master records unchanged. |\n| Lookup duplicates\
      \ | Iterating several records for one key (`get(...)` then `next()`) needs the\
      \ lookup table's `keyDuplicates=true`; `get(...)` returns null on a miss. |\n\
      | Rounding | `round(decimal, n)` rounds halves away from zero: `round(2.505D,\
      \ 2) = 2.51`, `round(-2.505D, 2) = -2.51`. |\n| Graph parameters | `RUN_ID`\
      \ is reserved by the server (it is replaced by the numeric execution id); use\
      \ another name for business run ids. |\n| Strings | `length()` counts UTF-16\
      \ code units (`length(\"A\U0001F600\") = 3`). `sort()` on a string list is case-sensitive,\
      \ by UTF-16 code unit (upper case before lower case). |\n| DataIntersection\
      \ | See §8.9: `$out.0`, emitted on port 1; `STOP` fails the component. |\n"
