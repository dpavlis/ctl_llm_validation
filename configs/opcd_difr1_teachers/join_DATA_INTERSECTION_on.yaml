      \ them fails when the component initializes.\n- Defaults: *Equal NULL* = true (null key values match each other); *Allow\
      \ key duplicates* = true (duplicate keys give the Cartesian product of pairs, A-major).\n\n```ctl\n//#CTL2\nfunction\
      \ integer transform() {\n    if ($in.0.status == $in.1.status && $in.0.amount == $in.1.amount) {\n        return SKIP;\
      \              // unchanged pair: nothing to emit\n    }\n    $out.0.* = $in.1.*;           // the pair's result record\n\
