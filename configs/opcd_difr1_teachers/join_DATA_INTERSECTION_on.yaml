      \ Input 0 is flow A (e.g. the previous snapshot), input 1 is flow B (e.g. the new data). There is no master or slave:\
      \ for every key present on both sides the component pairs the A record with the B record and calls `transform()` once\
      \ per pair.\n\n- `transform()` sees **one matched pair**: `$in.0` is the A record, `$in.1` the B record. It fills **one\
      \ output record, `$out.0`**, with the transform's own output metadata, and returns `OK` to emit it or `SKIP` to drop\
      \ the pair. `STOP` makes the component fail.\n- Records whose key is on one side only never reach the CTL. The component\
      \ passes them on by itself, unchanged, on its other outputs; which consumers are connected there is a graph matter and\
