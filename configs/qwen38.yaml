# =============================================================================
# LlamaFactory SFT → DPO → Export pipeline config
#
# Usage:
#   cd ~/LlamaFactory
#   python ~/llama_train/train.py ~/llama_train/configs/example.yaml
#   python ~/llama_train/train.py ~/llama_train/configs/example.yaml --dry-run
#
# The script merges the common section with each phase section, so any key
# set here in the common area is inherited by both SFT and DPO unless
# explicitly overridden in the sft: or dpo: subsections.
# =============================================================================

# --- Pipeline identity (not passed to LlamaFactory) -------------------------
run_name: qwen38-27B
output_base: saves          # All outputs land under saves/<run_name>/<timestamp>_<phase>/

# =============================================================================
# Common parameters — shared by both SFT and DPO phases
# =============================================================================

# Model
model_name_or_path: Qwen/Qwen3.8-27B
trust_remote_code: true

# Architecture / efficiency
finetuning_type: lora
template: qwen3_8     #qwen3_nothink     # Use qwen3_5_nothink for Qwen3.5 variants
flash_attn: auto
preprocessing_num_workers: 16
ddp_timeout: 180000000
fp16: false                       # Switch to bf16: true for Ampere+ GPUs
bf16: true                      # Only set to true if your GPU supports it; otherwise use fp16

# LoRA (phase sections can override lora_rank / lora_alpha individually)
lora_target: "q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj"
# additional_target: "embed_tokens, lm_head" #too aggresive
lora_dropout: 0.05
#loraplus_lr_embedding: 1e-6  # without additional_targets enable this has no effect # Standard fallback for token embedding stability
seed: 42

# Training dynamics (shared defaults — phases override as needed)
packing: false

# Thinking is set PER PHASE below, not here — the three phases need different
# values.  See the comment block above the sft: section.
enable_thinking: false

# Handed to Qwen38ReasoningTemplate.  "xhigh" (the LlamaFactory default) prepends
# a "Reasoning effort is set to xhigh. Please think carefully..." sentence to the
# system message; "medium" prepends nothing.  Must match `mut.reasoning_effort`
# in configs/eval_qwen38.yaml or train and eval see different system prompts.
reasoning_effort: medium
optim: adamw_torch_fused #adamw_torch
weight_decay: 0.05
max_grad_norm: 1.0
#lr_scheduler_type: cosine_with_min_lr  #linear # #constant_with_warmupa
#lr_scheduler_kwargs:
#    min_lr: 5.0e-6
warmup_ratio: 0.05
#warmup_steps: 47  
logging_steps: 25
save_steps: 50
save_strategy: steps
save_total_limit: 8
include_num_input_tokens_seen: true
plot_loss: true

#train_sampling_strategy: "group_by_length" #enable later

# Reporting — set to "none" to disable
report_to: wandb
# Uncomment to also log to SwanLab:
# use_swanlab: true
# swanlab_project: llamafactory
# swanlab_run_name: qwen3-clover
# swanlab_mode: local

# Dataset directory (relative to the directory you run the script from)
dataset_dir: data

# =============================================================================
# SFT phase  (merged on top of common; these keys take precedence)
#
# Three phases, one invocation:
#
#   python train.py configs/qwen38.yaml
#
#     1. sft            enable_thinking: false   full corpus, answer only
#     2. dpo            enable_thinking: false   preference pairs (no <think> in data)
#     3. post_dpo_sft   enable_thinking: true    reasoning subset
#     4. export                                  all three adapters merged in order
#
# DPO sits in the middle on purpose: its 1872 pairs carry no <think> blocks, so
# it belongs while the model is still a non-thinking model.  Running it after
# phase 3 would align the model in a context that never occurs at inference.
#
# Why enable_thinking: false works here even though the data has <think> blocks:
# Template.remove_thought() strips them and Template.encode_oneturn() moves an
# empty block into the PROMPT, where it carries no loss.  That strip only fires
# on LlamaFactory's exact thought_words spelling ("<think>\n" ... "\n</think>\n\n"),
# which is what the fixed convert_think.py now emits.
# =============================================================================
sft:
  - dataset: clover_ctl_trainign_data
    enable_thinking: false        # <think> blocks stripped into the prompt, no loss
    eval_dataset: clover_ctl_eval_data
    cutoff_len:  3200
    lr_scheduler_type: cosine_with_restarts #cosine_with_min_lr  #linear # #constant_with_warmupa
    lr_scheduler_kwargs:
      #min_lr: 5.0e-6
          num_cycles: 2
    learning_rate: 5.0e-5
    num_train_epochs: 2
    max_samples: 150000
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 6
    per_device_eval_batch_size: 4 #1

    # LoRA dims for SFT
    lora_rank: 64
    lora_alpha: 64
    loraplus_lr_ratio: 2

    # Evaluation during SFT
    eval_strategy: steps
    eval_steps: 50
    load_best_model_at_end: true
    metric_for_best_model: eval_loss
    greater_is_better: false

    # create_new_adapter is forced True by the script; listed here for clarity
    create_new_adapter: true

# =============================================================================
# DPO phase  (merged on top of common; adapter_name_or_path is set by script)
# =============================================================================
dpo:
  # CTL_LoRA_DPO_data.jsonl has 0/1872 chosen and 0/1872 rejected with <think>
  # blocks.  With enable_thinking: false the empty block lands in the prompt and
  # carries no loss; with true it would be prepended to both sides of every pair.
  enable_thinking: false
  dataset: clover_dpo_data
  eval_dataset: clover_dpo_eval_data
  cutoff_len:  4160
  learning_rate: 5.0e-6
  lr_scheduler_type: cosine   # Ensures smooth decay over the shorter step count
  warmup_ratio: 0.1       
  num_train_epochs: 1.0
  max_samples: 150000
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  per_device_eval_batch_size: 1

  # LoRA dims for DPO
  lora_rank: 64
  lora_alpha: 64
  loraplus_lr_ratio: 1

  # DPO objective
  pref_beta: 0.1
  pref_ftx: 0.1
  pref_loss: sigmoid

  # Evaluation / checkpoint selection during DPO
  eval_strategy: steps
  eval_steps: 25
  save_steps: 25
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false

  # To resume DPO from an existing adapter instead of the SFT output,
  # set this and run with --skip-sft:
  # adapter_name_or_path: saves/qwen3-clover/2026-05-10-12-00-00_sft

# =============================================================================
# Phase 3 — thinking SFT, runs AFTER DPO
#
# train.py merges the SFT and DPO adapters into the base and starts a fresh LoRA
# here, then extends the export adapter chain on its own.  Output lands in
# saves/qwen38-27B/<timestamp>_postsft.
#
# The reasoning subset is small (452 records at time of writing), so this is a
# short, gentle round — a high LR here washes out the DPO alignment that phase 2
# just installed.
# =============================================================================
post_dpo_sft:
  - dataset: clover_ctl_think_data
    enable_thinking: true         # the only phase that trains on <think> content
    eval_dataset: clover_ctl_think_eval_data
    cutoff_len: 4096

    learning_rate: 1.0e-5
    num_train_epochs: 3
    lr_scheduler_type: cosine
    max_samples: 150000
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 6
    per_device_eval_batch_size: 4

    lora_rank: 32
    lora_alpha: 32
    loraplus_lr_ratio: 1

    logging_steps: 5
    save_steps: 25
    eval_strategy: steps
    eval_steps: 25
    # eval_loss here is ~76% answer tokens / ~24% thinking tokens, so it is still
    # mostly an answer-quality signal — but on a few hundred examples it is noisy.
    # Treat test.py + the judge as the real selection signal.
    load_best_model_at_end: true
    metric_for_best_model: eval_loss
    greater_is_better: false

# =============================================================================
# Export phase  (merged into a minimal export config by the script)
# =============================================================================
export:
  export_size: 5            # Shard size in GB
  export_device: auto       # cpu or auto
  export_legacy_format: false

  # Override the auto-generated export path if you want a fixed location:
  export_dir: /home/pavlisd/exports/qwen38/
