# =============================================================================
# dpodef1 (spec/thinking_dpo_defaults_plan.md): thinking-on DPO on rb1006 (SFT checkpoint-2166 +
# DPO checkpoint-489) against the "declared variables start null" belief. Pairs: rb1006's own
# thinking samples on corpus prompts with tempting bare declarations -- repair pairs (rejected =
# belief sample, chosen = minimal gpt-6-sol repair), natural pairs (clean vs belief sample of the
# same prompt) and contrast pairs; max 2 per prompt; 50 prompts held out as the belief probe.
# Data: data/self_distill/dpodef1/dpodef1_train.jsonl. Single GPU, chunked logps.
#   cd ~/LlamaFactory && python ~/llama_train/train.py ~/llama_train/configs/qwen38_dpodef1_on_rb1006.yaml --skip-sft --skip-post-sft
# =============================================================================
run_name: qwen38-27B-dpodef1-on-rb1006
output_base: saves

# --- Common parameters: identical to configs/qwen38.yaml -------------------
model_name_or_path: Qwen/Qwen3.8-27B
trust_remote_code: true

finetuning_type: lora
template: qwen3_8
flash_attn: auto
preprocessing_num_workers: 16
ddp_timeout: 180000000
fp16: false
bf16: true

lora_target: "q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj"
lora_dropout: 0.05
seed: 42

packing: false
enable_thinking: false        # set per phase; phase 3 turns it on below

# Must match the sampling config (configs/eval_T04_fix6_sftdpo_think.yaml,
# mut.reasoning_effort) — the traces were drawn under "medium", which adds no
# reasoning-effort sentence to the system prompt.
reasoning_effort: medium
optim: adamw_torch_fused
weight_decay: 0.05
max_grad_norm: 1.0
warmup_ratio: 0.05
include_num_input_tokens_seen: true
plot_loss: true

report_to: wandb
dataset_dir: data


dpo:
  adapter_name_or_path: /home/pavlisd/LlamaFactory/saves/qwen38-27B-rb1006/2026-10-05-22-37-16_sft/checkpoint-2166,/home/pavlisd/LlamaFactory/saves/qwen38-27B-rb1006/2026-10-05-22-37-16_dpo/checkpoint-489
  dataset: clover_dpodef1_data
  enable_thinking: true
  cutoff_len: 6144
  dpo_logps_chunk_size: 1024
  learning_rate: 5.0e-6
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  num_train_epochs: 2.0
  max_samples: 150000
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  lora_rank: 64
  lora_alpha: 64
  loraplus_lr_ratio: 1
  pref_beta: 0.1
  pref_ftx: 0.1
  pref_loss: sigmoid
  logging_steps: 2
  save_strategy: epoch
  save_total_limit: 4
  eval_strategy: "no"
  load_best_model_at_end: false

export:
  export_size: 5
  export_device: auto
  export_legacy_format: false
  export_dir: /home/pavlisd/exports/qwen38_rb1006_dpodef1/
