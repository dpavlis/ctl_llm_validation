# OPCD generate-gap teacher check: c4 (guide system prompt), thinking OFF -- data/opcd/build_teacher_check.py
judge:
  api_key: local
  base_url: http://127.0.0.1:9001/v1
  model: gpt-6.1-sol
  provider: openai
  reasoning_effort: medium
mut:
  device_map: auto
  dtype: bfloat16
  enable_thinking: false
  generate:
    temperature: 0.4
    top_k: 20
    top_p: 0.95
  max_new_tokens: 16384
  mode: vllm
  model_path: /home/pavlisd/exports/qwen38_rb1006_off
  reasoning_effort: medium
  run_label: qwen38_tcheck_c4_guide_off
  validate:
    system_prompt: 'You are a CloverDX ETL expert specializing in transformation graphs,
      components, and CTL2. CTL and CTL2 mean the same language.

      Help users write, debug, and explain CTL2 code and related concepts. Provide
      working code, explanation, or both as needed.

      Prefer correct, practical, minimal solutions.

      '
    temperature: 0.4
    top_k: 20
    top_p: 0.95
  vllm_model: c4_r015
  vllm_url: http://127.0.0.1:3011
output_dir: ./results
runs_per_test: 1
suite_file: /home/pavlisd/llama_train/data/opcd/teacher_check/suite_guide.json
test_ids: null
timeout_seconds: 240
training_config: configs/qwen38.yaml
