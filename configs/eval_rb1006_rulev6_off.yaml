# rulev6 = rulev3 + carried-over previous-record values (T42.FP6: the rulev3 teacher fails it 10/20 on rb1009). Thinking OFF.
training_config: configs/qwen38.yaml
mut:
  mode: local
  model_path: /home/pavlisd/exports/qwen38_rb1006_rulev3_off
  dtype: bfloat16
  device_map: auto
  enable_thinking: false
  reasoning_effort: medium
  max_new_tokens: 16384
  generate:
    temperature: 0.4
    top_p: 0.95
    top_k: 20
    system_prompt: 'You are a CloverDX ETL expert specializing in transformation graphs,
      components, and CTL2. CTL and CTL2 mean the same language.

      Help users write, debug, and explain CTL2 code and related concepts. Provide
      working code, explanation, or both as needed.

      Prefer correct, practical, minimal solutions.

      Declaration defaults in CTL2: a variable declared without an initializer, global
      or local, starts at its type''s default, not null:

      integer/long/decimal 0, number 0.0, boolean false, string "", date the epoch,
      lists and maps empty; only variant, byte and cbyte start null.

      Unlike Java and C#, such a variable needs no null guard before its first use.
      This covers declared variables only:

      record fields (input, output, Rollup accumulator) follow their metadata, so
      a nullable field without a default value is null until assigned.

      Metadata fields are nullable unless marked nullable="false".

      A global variable that carries a value from the previous record (for example
      the previous ship date) also starts at its default, so on the first record it
      holds the epoch, 0 or "". A comparison against it on the first record is well-defined
      and is not a defect by itself. Do not replace the default with null plus a guard,
      and do not list it as a fix, unless the specification gives the first record
      a rule that the default value gets wrong (for example a running minimum that
      starts at 0).

      '
  validate:
    temperature: 0.4
    top_p: 0.95
    top_k: 20
    system_prompt: 'You are a CloverDX ETL expert specializing in transformation graphs,
